<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>가계부</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div style="height:100dvh;display:flex;justify-content:center;background:var(--g1);overflow:hidden">
<div style="width:100%;max-width:430px;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;border-left:1px solid var(--g2);border-right:1px solid var(--g2);overflow:hidden">

  <!-- ===== 예산 없음 (첫 실행) ===== -->
  <div data-show="noBudget" style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:32px 24px">
    <div style="font-size:13px;color:var(--g3);letter-spacing:.02em">가계부</div>
    <div style="font-size:26px;font-weight:700;line-height:1.35;letter-spacing:-.02em">기간과 총액을 정하면<br />바로 시작합니다</div>
    <button data-act="openBudget" style="margin-top:8px;height:56px;border:none;border-radius:14px;background:var(--fg);color:var(--bg);font-size:17px;font-weight:700">예산 만들기</button>
  </div>

  <!-- ===== 예산 있음 ===== -->
  <div data-show="hasBudget" style="flex:1;min-height:0;display:flex;flex-direction:column">

    <div style="display:flex;align-items:center;gap:20px;padding:18px 20px 0">
      <div style="flex:1;display:flex;gap:20px">
        <button data-act="goHome" data-el="tabHome">메인</button>
        <button data-act="goHistory" data-el="tabHistory">내역</button>
        <button data-act="goSummary" data-el="tabSummary">요약</button>
      </div>
      <button data-act="openMenu" style="border:none;background:none;padding:6px 0 12px;font-size:18px;color:var(--g3);letter-spacing:.08em">⋯</button>
    </div>
    <div style="height:1px;background:var(--g2);margin-top:-1px"></div>

    <div data-el="scroller" style="flex:1;min-height:0;overflow-y:auto;padding-bottom:120px">

      <!-- ----- 메인 ----- -->
      <div data-show="isHome">
        <div style="padding:12px 20px 22px">
          <div style="font-size:12px;color:var(--g3);letter-spacing:.04em">남은 금액</div>
          <div data-el="remainingRow" style="display:flex;align-items:baseline;gap:4px;margin-top:2px">
            <div data-el="remainingText" class="mm-fit" style="font-size:56px;font-weight:800;letter-spacing:-.045em;line-height:1.05">0</div>
            <div data-el="remainingWon" style="font-size:20px;font-weight:600;color:var(--g3)">원</div>
          </div>

          <div style="margin-top:18px;height:10px;border-radius:5px;background:var(--g1);overflow:hidden">
            <div data-el="gauge"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--g3)">
            <span><span data-el="spentText">0</span>원 씀</span>
            <span><span data-el="totalText">0</span>원</span>
          </div>

          <div style="display:flex;margin-top:22px;border:1px solid var(--g2);border-radius:14px;overflow:hidden">
            <div style="flex:1;padding:14px 16px;min-width:0">
              <div style="font-size:11px;color:var(--g3)">오늘 쓸 수 있는 돈</div>
              <div data-el="perDayRow" style="display:flex;align-items:baseline;gap:3px;margin-top:4px">
                <div data-el="perDayText" class="mm-fit" style="font-size:24px;font-weight:700;letter-spacing:-.03em">0</div>
                <div data-el="perDayWon" style="font-size:12px;color:var(--g3)">원</div>
              </div>
            </div>
            <div style="width:1px;background:var(--g2)"></div>
            <div style="flex:1;padding:14px 16px;min-width:0">
              <div style="font-size:11px;color:var(--g3)">오늘 쓴 돈</div>
              <div data-el="todaySpentRow" style="display:flex;align-items:baseline;gap:3px;margin-top:4px">
                <div data-el="todaySpentText" class="mm-fit" style="font-size:24px;font-weight:700;letter-spacing:-.03em">0</div>
                <div data-el="todaySpentWon" style="font-size:12px;color:var(--g3)">원</div>
              </div>
            </div>
          </div>
          <div data-el="daysLeftText" style="margin-top:8px;font-size:11px;color:var(--g3);text-align:right"></div>
        </div>

        <div style="padding:0 20px">
          <div style="font-size:13px;font-weight:700;padding-bottom:10px">오늘 내역</div>
          <div data-show="todayEmpty" style="padding:26px 0;text-align:center;font-size:13px;color:var(--g3)">아직 없습니다</div>
          <div data-el="todayList"></div>
        </div>
      </div>

      <!-- ----- 내역 ----- -->
      <div data-show="isHistory" style="padding:10px 0 0">
        <div data-el="budgetChips" style="display:flex;gap:8px;overflow-x:auto;padding:0 20px 14px"></div>
        <div style="padding:0 20px">
          <div data-show="selMode" style="display:flex;align-items:center;gap:14px;padding:2px 0 12px">
            <div data-el="selCountText" style="flex:1;font-size:14px;font-weight:700">0개 선택됨</div>
            <button data-act="selectAll" style="border:none;background:none;padding:6px 0;font-size:13px;color:var(--g3)">전체 선택</button>
            <button data-act="deleteSelected" style="border:none;border-radius:9px;background:var(--fg);color:var(--bg);padding:8px 14px;font-size:13px;font-weight:700">삭제</button>
            <button data-act="exitSel" style="border:none;background:none;padding:6px 0;font-size:13px;color:var(--g3)">취소</button>
          </div>
          <div data-show="notSelMode" style="display:flex;align-items:baseline;justify-content:space-between;padding-bottom:14px">
            <div data-el="viewPeriodText" style="font-size:12px;color:var(--g3)"></div>
            <div style="display:flex;align-items:baseline;gap:14px">
              <div style="font-size:15px;font-weight:700"><span data-el="viewSpentText">0</span>원</div>
              <button data-act="enterSel" style="border:none;background:none;padding:0;font-size:13px;color:var(--g3)">선택</button>
            </div>
          </div>
          <div data-show="viewEmpty" style="padding:40px 0;text-align:center;font-size:13px;color:var(--g3)">내역이 없습니다</div>
          <div data-el="groups"></div>
          <div data-show="hasRows" style="font-size:10px;color:var(--g2);text-align:center;padding-bottom:6px">길게 눌러 여러 개 선택</div>
        </div>
      </div>

      <!-- ----- 요약 ----- -->
      <div data-show="isSummary" style="padding:10px 0 0">
        <div data-el="budgetChipsSummary" style="display:flex;gap:8px;overflow-x:auto;padding:0 20px 14px"></div>
        <div style="padding:0 20px">
          <div style="display:flex;flex-direction:column;align-items:center;padding:6px 0 24px">
            <div data-el="donut" style="position:relative;width:196px;height:196px;border-radius:50%;display:flex;align-items:center;justify-content:center">
              <div style="width:150px;height:150px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
                <div style="font-size:11px;color:var(--g3)">사용</div>
                <div data-el="usedPctText" style="font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1">0%</div>
                <div style="font-size:12px;color:var(--g3)"><span data-el="viewSpentText2">0</span>원</div>
              </div>
            </div>
            <div style="font-size:12px;color:var(--g3);padding-top:14px"><span data-el="viewPeriodText2"></span> · 예산 <span data-el="viewTotalText">0</span>원</div>
          </div>
          <div data-show="viewEmpty" style="padding:40px 0;text-align:center;font-size:13px;color:var(--g3)">내역이 없습니다</div>
          <div data-el="shares"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== 입력 버튼 ===== -->
  <div data-show="isHome" data-el="fabWrap">
    <div style="position:absolute;left:0;right:0;bottom:0;height:118px;pointer-events:none;background:linear-gradient(to top, var(--bg) 0, var(--bg) 62%, transparent 100%)"></div>
    <button data-act="openAdd" style="position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:72px;height:72px;padding:0;border-radius:36px;border:none;background:var(--fg);color:var(--bg);box-shadow:0 4px 16px rgba(0,0,0,.18);display:grid;place-items:center">
      <svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true" style="display:block"><path d="M13 3.5 V22.5 M3.5 13 H22.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg>
    </button>
  </div>

  <!-- ===== 스낵바 ===== -->
  <div data-show="snackOpen" style="position:absolute;left:16px;right:16px;bottom:88px;height:48px;border-radius:12px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;z-index:60;animation:mmUp .18s ease-out">
    <span data-el="snackText"></span>
    <button data-act="undo" style="border:none;background:none;color:var(--bg);font-size:13px;font-weight:700;padding:6px 0">취소</button>
  </div>

  <!-- ===== 지출 입력 ===== -->
  <div data-show="addOpen" style="position:absolute;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;animation:mmUp .2s ease-out">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 2px;flex:0 0 auto">
      <button data-act="closeAdd" style="border:none;background:none;padding:0;font-size:14px;color:var(--g3)">닫기</button>
      <input type="date" data-el="draftDate" style="border:1px solid var(--g2);border-radius:9px;padding:5px 9px;font-size:12px;color:var(--g3)" />
    </div>

    <div data-el="draftAmountRow" style="padding:2px 20px 8px;display:flex;align-items:baseline;justify-content:flex-end;gap:5px;flex:0 0 auto">
      <div data-el="draftAmountText" class="mm-fit">0</div>
      <div data-el="draftAmountWon" style="font-size:18px;font-weight:600;color:var(--g3)">원</div>
    </div>

    <div style="padding:0 20px 6px;flex:0 0 auto">
      <input data-el="draftMemo" placeholder="메모 (선택)" maxlength="60" style="width:100%;border:none;border-bottom:1px solid var(--g2);padding:8px 0;font-size:14px;outline:none" />
    </div>

    <div data-el="catGrid" style="flex:0 0 auto;padding:4px 16px 8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-content:start"></div>

    <div style="flex:1;min-height:0"></div>

    <div data-el="keys" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px;flex:0 0 auto"></div>

    <div style="padding:8px 16px max(8px,env(safe-area-inset-bottom));display:flex;gap:10px;flex:0 0 auto">
      <button data-show="editing" data-act="deleteEditing" style="width:96px;height:clamp(44px,7dvh,56px);border:1px solid var(--g2);border-radius:14px;background:none;font-size:15px;font-weight:600">삭제</button>
      <button data-act="save" data-el="save">저장</button>
    </div>
  </div>

  <!-- ===== 메뉴 ===== -->
  <div data-show="menuOpen" data-act="closeMenu" style="position:absolute;inset:0;z-index:85;background:rgba(0,0,0,.28);display:flex;flex-direction:column;justify-content:flex-end">
    <div data-el="menuSheet" style="background:var(--bg);border-top-left-radius:18px;border-top-right-radius:18px;padding:8px 8px 18px;animation:mmUp .18s ease-out">
      <button data-act="openBudget" style="width:100%;text-align:left;border:none;background:none;padding:16px;font-size:15px;font-weight:600">예산 관리</button>
      <button data-act="openCats" style="width:100%;text-align:left;border:none;background:none;padding:16px;font-size:15px;font-weight:600;border-top:1px solid var(--g1)">카테고리 편집</button>
      <button data-act="toggleTheme" style="width:100%;text-align:left;border:none;background:none;padding:16px;font-size:15px;font-weight:600;border-top:1px solid var(--g1)"><span data-el="themeLabel">다크</span> 모드</button>
      <button data-act="deleteAllFromMenu" style="width:100%;text-align:left;border:none;background:none;padding:16px;font-size:15px;font-weight:600;border-top:1px solid var(--g1);color:var(--g3)">내역 전체 삭제</button>
    </div>
  </div>

  <!-- ===== 예산 ===== -->
  <div data-show="budgetOpen" style="position:absolute;inset:0;background:var(--bg);z-index:90;display:flex;flex-direction:column;animation:mmUp .2s ease-out">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px">
      <div style="font-size:16px;font-weight:700">예산</div>
      <button data-act="closeBudget" style="border:none;background:none;padding:0;font-size:14px;color:var(--g3)">닫기</button>
    </div>
    <div style="padding:4px 20px;overflow-y:auto;flex:1">
      <div style="border:1px solid var(--g2);border-radius:14px;padding:16px">
        <div style="font-size:12px;color:var(--g3);padding-bottom:10px">새 예산</div>
        <input data-el="nbName" placeholder="이름 (예: 부산 여행)" maxlength="30" style="width:100%;border:none;border-bottom:1px solid var(--g2);padding:8px 0;font-size:15px;font-weight:600;outline:none" />
        <div style="display:flex;gap:10px;padding-top:14px">
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;color:var(--g3);padding-bottom:5px">시작</div>
            <input type="date" data-el="nbStart" style="width:100%;border:1px solid var(--g2);border-radius:9px;padding:8px;font-size:13px" />
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;color:var(--g3);padding-bottom:5px">종료</div>
            <input type="date" data-el="nbEnd" style="width:100%;border:1px solid var(--g2);border-radius:9px;padding:8px;font-size:13px" />
          </div>
        </div>
        <div style="padding-top:14px">
          <div style="font-size:11px;color:var(--g3);padding-bottom:5px">총액</div>
          <div style="display:flex;align-items:baseline;gap:5px;border-bottom:1px solid var(--g2)">
            <input inputmode="numeric" data-el="nbTotal" placeholder="0" style="flex:1;min-width:0;border:none;padding:6px 0;font-size:30px;font-weight:800;letter-spacing:-.03em;outline:none;text-align:right" />
            <div style="font-size:15px;color:var(--g3)">원</div>
          </div>
        </div>
        <button data-act="createBudget" data-el="createBudget" style="margin-top:16px;width:100%;height:52px;border:none;border-radius:13px;background:var(--fg);color:var(--bg);font-size:16px;font-weight:700">이 예산으로 시작</button>
      </div>

      <div style="font-size:12px;color:var(--g3);padding:22px 0 8px">지난 예산</div>
      <div data-el="budgetList"></div>
    </div>
  </div>

  <!-- ===== 카테고리 ===== -->
  <div data-show="catsOpen" style="position:absolute;inset:0;background:var(--bg);z-index:90;display:flex;flex-direction:column;animation:mmUp .2s ease-out">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px">
      <div style="font-size:16px;font-weight:700">카테고리</div>
      <button data-act="closeCats" style="border:none;background:none;padding:0;font-size:14px;color:var(--g3)">닫기</button>
    </div>
    <div style="padding:0 20px 20px;overflow-y:auto;flex:1">
      <div style="display:flex;gap:8px;padding-bottom:14px">
        <input data-el="newCatEmoji" placeholder="🙂" maxlength="4" style="width:52px;border:1px solid var(--g2);border-radius:10px;padding:10px;font-size:18px;text-align:center;outline:none" />
        <input data-el="newCatName" placeholder="새 카테고리 이름" maxlength="20" style="flex:1;min-width:0;border:1px solid var(--g2);border-radius:10px;padding:10px;font-size:14px;outline:none" />
        <button data-act="addCat" data-el="addCat" style="width:56px;flex:0 0 auto;border:none;border-radius:10px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:700">추가</button>
      </div>
      <div data-el="catList"></div>
      <div style="font-size:11px;color:var(--g3);padding-top:14px;line-height:1.6">입력 화면에서는 최근·자주 쓴 순서로 자동 정렬됩니다.</div>
    </div>
  </div>

</div>
</div>

<script src="js/calc.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
